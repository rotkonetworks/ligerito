[workspace]
resolver = "2"
members = [
    "ligerito",
    "ligerito-binary-fields",
    "ligerito-merkle",
    "ligerito-reed-solomon",
]

[workspace.package]
authors = ["rotko networks"]
edition = "2021"
license = "MIT"
repository = "https://github.com/rotkonetworks/ligerito"

[workspace.dependencies]
ligerito = { path = "ligerito" }
ligerito-binary-fields = { path = "ligerito-binary-fields" }
ligerito-merkle = { path = "ligerito-merkle" }
ligerito-reed-solomon = { path = "ligerito-reed-solomon" }

bytemuck = { version = "1", default-features = false, features = ["extern_crate_alloc"] }
criterion = "0.5"
hex = "0.4"
merlin = "3.0"
proptest = "1.4"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.8"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }
thiserror = "1.0"
wide = { version = "0.7", default-features = false }

[profile.release]
lto = true
codegen-units = 1
